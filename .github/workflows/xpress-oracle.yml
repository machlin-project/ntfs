name: Native XPRESS raw oracle
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-xpress:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[xpress-oracle]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check bounded acquisition, reset, comparison and cleanup contracts
        run: python tests/windows_xpress_contract.py
      - name: Compare unmodified authored packets against actual Cabinet raw decoding
        run: python scripts/collect_windows_xpress.py --output artifacts/windows-xpress
      - name: Retain original corpus, native verdicts and first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-xpress-observations
          path: artifacts/windows-xpress
          if-no-files-found: error
          retention-days: 14
