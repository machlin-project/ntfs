name: Portable NTFS
on:
  push:
    branches: [development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ntfs-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install meson==1.11.1 ninja==1.13.2
      - run: make test
      - name: Compare isolated release products
        run: python3 scripts/check_reproducible.py --output artifacts/reproducibility
      - name: Record results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}
          path: |
            .build/meson-logs/testlog.json
            artifacts/reproducibility/report.json
            artifacts/reproducibility/*-setup.log
            artifacts/reproducibility/*-compile.log
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install meson==1.11.1 ninja==1.13.2
      - run: make build
      - run: python3 scripts/bootstrap_test_tools.py
      - run: python3 tests/interoperability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-oracle
          path: |
            artifacts/interoperability/report.json
            artifacts/interoperability/commands.log
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/fuzz.py --seconds 60
      - run: python3 scripts/fuzz.py --target logfile --seconds 60 --output artifacts/fuzz-logfile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-fuzz
          path: |
            artifacts/fuzz/report.json
            artifacts/fuzz/run-*/image/run.log
            artifacts/fuzz-logfile/report.json
            artifacts/fuzz-logfile/run-*/logfile/run.log
