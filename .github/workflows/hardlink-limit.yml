name: Native hard-link limit
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-hardlink-limit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cloud-full]') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent observer contracts
        run: python tests/test_windows_hardlink_limit.py
      - name: Observe native NTFS link-count boundary
        run: python scripts/collect_windows_hardlink_limit.py --output artifacts/windows-hardlink-limit
      - name: Retain original native observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-hardlink-limit
          path: artifacts/windows-hardlink-limit
          if-no-files-found: error
          retention-days: 14
